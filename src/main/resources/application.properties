spring.application.name=sigvs

# Configuração do Banco de Dados em Memória (H2)
# Isso cria um banco de dados novo toda vez que o sistema inicia (bom para testes)
spring.datasource.url=jdbc:h2:mem:vendasdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração do JPA/Hibernate
# O H2 gera as tabelas automaticamente com base nas suas entidades (modelos)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Opcional: Deixar o H2 visível no console (útil para verificar se os dados foram criados)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
